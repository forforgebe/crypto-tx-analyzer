<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto TX Analyzer - MiniMax</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 {
            text-align: center;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2em;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .lang-switch {
            display: flex;
            gap: 4px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 4px;
        }
        .lang-btn {
            padding: 6px 12px;
            background: transparent;
            border: none;
            color: #888;
            cursor: pointer;
            border-radius: 6px;
            font-size: 13px;
            transition: all 0.2s;
        }
        .lang-btn.active {
            background: rgba(0,212,255,0.2);
            color: #00d4ff;
        }
        .links a {
            color: #00d4ff;
            text-decoration: none;
            font-size: 13px;
            margin-left: 12px;
        }
        .links a:hover { text-decoration: underline; }
        label { display: block; margin-bottom: 8px; color: #aaa; font-size: 14px; }
        input, textarea {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            margin-bottom: 16px;
        }
        input:focus, textarea:focus { outline: none; border-color: #00d4ff; }
        textarea { height: 100px; resize: vertical; }
        button {
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .result {
            background: rgba(0,212,255,0.05);
            border: 1px solid rgba(0,212,255,0.2);
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-height: 400px;
            overflow-y: auto;
        }
        .loading { text-align: center; color: #00d4ff; display: none; }
        .chains { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
        .chain-btn {
            padding: 8px 16px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            color: #fff;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .chain-btn:hover, .chain-btn.active {
            background: rgba(0,212,255,0.2);
            border-color: #00d4ff;
        }
        .templates { display: flex; gap: 8px; flex-wrap: wrap; }
        .footer {
            text-align: center;
            margin-top: 40px;
            color: #555;
            font-size: 12px;
        }
        .footer a { color: #00d4ff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <div class="lang-switch">
                <button class="lang-btn active" onclick="setLang('en')">EN</button>
                <button class="lang-btn" onclick="setLang('zh')">中文</button>
            </div>
            <div class="links">
                <a href="https://github.com/forforgebe/crypto-tx-analyzer" target="_blank">GitHub</a>
                <a href="https://crypto-analyzer-gilt.vercel.app" target="_blank">Live</a>
            </div>
        </div>

        <h1 id="title">🔍 Crypto TX Analyzer</h1>
        <div class="subtitle" id="subtitle">AI-powered transaction analysis using MiniMax</div>

        <div class="card">
            <label id="lblApiKey">MiniMax API Key</label>
            <input type="password" id="apiKey" placeholder="Paste your MiniMax API key here">
            
            <label id="lblTx">Transaction Hash or Link</label>
            <input type="text" id="txInput" placeholder="0x... or full URL from explorer">
            
            <label id="lblChain">Chain</label>
            <div class="chains">
                <button class="chain-btn active" onclick="setChain('ethereum')">Ethereum</button>
                <button class="chain-btn" onclick="setChain('bsc')">BSC</button>
                <button class="chain-btn" onclick="setChain('polygon')">Polygon</button>
                <button class="chain-btn" onclick="setChain('arbitrum')">Arbitrum</button>
                <button class="chain-btn" onclick="setChain('base')">Base</button>
                <button class="chain-btn" onclick="setChain('optimism')">Optimism</button>
                <button class="chain-btn" onclick="setChain('avalanche')">Avalanche</button>
                <button class="chain-btn" onclick="setChain('solana')">Solana</button>
                <button class="chain-btn" onclick="setChain('tron')">TRON</button>
            </div>
            
            <label id="lblContext">Additional Context (optional)</label>
            <textarea id="context" placeholder="Any specific questions about this TX?"></textarea>
            
            <button onclick="analyze()" id="analyzeBtn">Analyze Transaction</button>
            
            <div class="loading" id="loading">⏳ <span id="loadingText">Analyzing...</span></div>
            <div class="result" id="result" style="display:none;"></div>
        </div>

        <div class="card">
            <label id="lblTemplates">Quick Analysis Templates</label>
            <div class="templates">
                <button class="chain-btn" onclick="setTemplate('rug')" id="tplRug">🔍 Rug Pull Check</button>
                <button class="chain-btn" onclick="setTemplate('whale')" id="tplWhale">🐋 Whale Movement</button>
                <button class="chain-btn" onclick="setTemplate('defi')" id="tplDefi">🏦 DeFi Interaction</button>
                <button class="chain-btn" onclick="setTemplate('nft')" id="tplNft">🖼️ NFT Trade</button>
                <button class="chain-btn" onclick="setTemplate('bridge')" id="tplBridge">🌉 Bridge Transfer</button>
            </div>
        </div>

        <div class="footer">
            Powered by <a href="https://xiaomimimo.com" target="_blank">MiniMax AI</a> • 
            <a href="https://github.com/forforgebe/crypto-tx-analyzer" target="_blank">Source Code</a>
        </div>
    </div>

    <script>
        let selectedChain = 'ethereum';
        let currentLang = 'en';

        const i18n = {
            en: {
                title: '🔍 Crypto TX Analyzer',
                subtitle: 'AI-powered transaction analysis using MiniMax',
                apiKey: 'MiniMax API Key',
                apiKeyPh: 'Paste your MiniMax API key here',
                tx: 'Transaction Hash or Link',
                txPh: '0x... or full URL from explorer',
                chain: 'Chain',
                context: 'Additional Context (optional)',
                contextPh: 'Any specific questions about this TX? e.g. "Is this a rug pull?" or "What tokens were transferred?"',
                analyze: 'Analyze Transaction',
                loading: 'Analyzing...',
                templates: 'Quick Analysis Templates',
                tplRug: '🔍 Rug Pull Check',
                tplWhale: '🐋 Whale Movement',
                tplDefi: '🏦 DeFi Interaction',
                tplNft: '🖼️ NFT Trade',
                tplBridge: '🌉 Bridge Transfer',
                tplRugCtx: "Analyze if this transaction is related to a rug pull. Check for: liquidity removal, token dumps, suspicious contract interactions, and any red flags.",
                tplWhaleCtx: "Analyze this whale movement. What tokens/amounts were transferred? Is this likely an OTC deal, exchange deposit/withdrawal, or portfolio rebalancing?",
                tplDefiCtx: "Analyze this DeFi interaction. What protocol was used? What was the action (swap, lend, borrow, stake)? What were the token amounts and prices?",
                tplNftCtx: "Analyze this NFT trade. What collection? What was the sale price? Is this a legitimate trade or wash trading?",
                tplBridgeCtx: "Analyze this bridge transfer. What chains are involved? What tokens? Is the bridge protocol safe?",
                errApiKey: 'Please enter your MiniMax API key',
                errTx: 'Please enter a transaction hash or link',
                systemPrompt: 'You are a crypto transaction analyst. You help users understand blockchain transactions by analyzing transaction hashes, contract interactions, token transfers, and DeFi activities. Provide clear, accurate analysis with risk assessments when relevant.',
                userPrompt: (chain, hash, ctx) => `Analyze this crypto transaction:\n\nChain: ${chain}\nTX Hash: ${hash}${ctx ? '\n\nSpecific question: ' + ctx : ''}\n\nPlease provide:\n1. Transaction type (transfer, swap, contract interaction, etc.)\n2. Parties involved (from/to addresses, contracts)\n3. Tokens/assets involved and amounts\n4. Gas used and cost\n5. Any notable observations (suspicious patterns, MEV, failed attempts)\n6. Risk assessment if applicable\n7. Summary in plain English\n\nBe thorough but concise.`
            },
            zh: {
                title: '🔍 加密货币交易分析器',
                subtitle: '基于 MiniMax AI 的智能交易分析',
                apiKey: 'MiniMax API 密钥',
                apiKeyPh: '在此粘贴您的 MiniMax API 密钥',
                tx: '交易哈希或链接',
                txPh: '0x... 或区块浏览器完整链接',
                chain: '区块链',
                context: '附加说明（可选）',
                contextPh: '对此交易有什么具体问题？例如"这是跑路吗？"或"转移了什么代币？"',
                analyze: '分析交易',
                loading: '分析中...',
                templates: '快捷分析模板',
                tplRug: '🔍 跑路检测',
                tplWhale: '🐋 巨鲸动向',
                tplDefi: '🏦 DeFi 交互',
                tplNft: '🖼️ NFT 交易',
                tplBridge: '🌉 跨链桥转账',
                tplRugCtx: "分析此交易是否与跑路有关。检查：流动性移除、代币抛售、可疑合约交互及任何危险信号。",
                tplWhaleCtx: "分析此巨鲸动向。转移了什么代币/金额？这可能是场外交易、交易所充提还是投资组合调整？",
                tplDefiCtx: "分析此 DeFi 交互。使用了什么协议？执行了什么操作（兑换、借贷、质押）？代币数量和价格是多少？",
                tplNftCtx: "分析此 NFT 交易。什么系列？成交价格是多少？这是正常交易还是洗盘交易？",
                tplBridgeCtx: "分析此跨链桥转账。涉及哪些链？什么代币？桥接协议安全吗？",
                errApiKey: '请输入 MiniMax API 密钥',
                errTx: '请输入交易哈希或链接',
                systemPrompt: '你是一位加密货币交易分析师。你帮助用户通过分析交易哈希、合约交互、代币转移和 DeFi 活动来理解区块链交易。提供清晰、准确的分析，并在相关时进行风险评估。请用中文回答。',
                userPrompt: (chain, hash, ctx) => `分析此加密货币交易：\n\n区块链：${chain}\n交易哈希：${hash}${ctx ? '\n\n具体问题：' + ctx : ''}\n\n请提供：\n1. 交易类型（转账、兑换、合约交互等）\n2. 涉及方（发送/接收地址、合约）\n3. 涉及的代币/资产及数量\n4. Gas 用量和成本\n5. 任何值得注意的观察（可疑模式、MEV、失败尝试）\n6. 风险评估（如适用）\n7. 用通俗语言总结\n\n请详细但简洁。`
            }
        };

        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            applyLang();
        }

        function applyLang() {
            const t = i18n[currentLang];
            document.getElementById('title').textContent = t.title;
            document.getElementById('subtitle').textContent = t.subtitle;
            document.getElementById('lblApiKey').textContent = t.apiKey;
            document.getElementById('apiKey').placeholder = t.apiKeyPh;
            document.getElementById('lblTx').textContent = t.tx;
            document.getElementById('txInput').placeholder = t.txPh;
            document.getElementById('lblChain').textContent = t.chain;
            document.getElementById('lblContext').textContent = t.context;
            document.getElementById('context').placeholder = t.contextPh;
            document.getElementById('analyzeBtn').textContent = t.analyze;
            document.getElementById('loadingText').textContent = t.loading;
            document.getElementById('lblTemplates').textContent = t.templates;
            document.getElementById('tplRug').textContent = t.tplRug;
            document.getElementById('tplWhale').textContent = t.tplWhale;
            document.getElementById('tplDefi').textContent = t.tplDefi;
            document.getElementById('tplNft').textContent = t.tplNft;
            document.getElementById('tplBridge').textContent = t.tplBridge;
        }

        function setChain(chain) {
            selectedChain = chain;
            document.querySelectorAll('.chain-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }
        
        function setTemplate(type) {
            const t = i18n[currentLang];
            const templates = { rug: t.tplRugCtx, whale: t.tplWhaleCtx, defi: t.tplDefiCtx, nft: t.tplNftCtx, bridge: t.tplBridgeCtx };
            document.getElementById('context').value = templates[type] || '';
        }
        
        async function analyze() {
            const t = i18n[currentLang];
            const apiKey = document.getElementById('apiKey').value.trim();
            const txInput = document.getElementById('txInput').value.trim();
            const context = document.getElementById('context').value.trim();
            
            if (!apiKey) { alert(t.errApiKey); return; }
            if (!txInput) { alert(t.errTx); return; }
            
            const btn = document.getElementById('analyzeBtn');
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            
            btn.disabled = true;
            loading.style.display = 'block';
            result.style.display = 'none';
            
            try {
                let txHash = txInput;
                if (txInput.includes('/')) {
                    const parts = txInput.split('/');
                    txHash = parts[parts.length - 1];
                }
                
                const response = await fetch('https://api.xiaomimimo.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'mimo-v2.5-pro',
                        messages: [
                            { role: 'system', content: t.systemPrompt },
                            { role: 'user', content: t.userPrompt(selectedChain, txHash, context) }
                        ],
                        temperature: 0.3,
                        max_tokens: 2000
                    })
                });
                
                if (!response.ok) throw new Error(`API error: ${response.status} ${response.statusText}`);
                
                const data = await response.json();
                result.textContent = data.choices[0].message.content;
                result.style.display = 'block';
                
            } catch (error) {
                result.textContent = 'Error: ' + error.message;
                result.style.display = 'block';
                result.style.borderColor = 'rgba(255,0,0,0.3)';
                result.style.background = 'rgba(255,0,0,0.05)';
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }
        
        document.getElementById('txInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') analyze();
        });

        applyLang();
    </script>
</body>
</html>
