<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto TX Analyzer - MiniMax</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2em;
        }
        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 14px;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            margin-bottom: 16px;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #00d4ff;
        }
        textarea {
            height: 100px;
            resize: vertical;
        }
        button {
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .result {
            background: rgba(0,212,255,0.05);
            border: 1px solid rgba(0,212,255,0.2);
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-height: 400px;
            overflow-y: auto;
        }
        .loading {
            text-align: center;
            color: #00d4ff;
            display: none;
        }
        .chains {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .chain-btn {
            padding: 8px 16px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            color: #fff;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .chain-btn:hover, .chain-btn.active {
            background: rgba(0,212,255,0.2);
            border-color: #00d4ff;
        }
        .footer {
            text-align: center;
            margin-top: 40px;
            color: #555;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Crypto TX Analyzer</h1>
        
        <div class="card">
            <label>MiniMax API Key</label>
            <input type="password" id="apiKey" placeholder="Paste your MiniMax API key here">
            
            <label>Transaction Hash or Link</label>
            <input type="text" id="txInput" placeholder="0x... or full URL from explorer">
            
            <label>Chain</label>
            <div class="chains">
                <button class="chain-btn active" onclick="setChain('ethereum')">Ethereum</button>
                <button class="chain-btn" onclick="setChain('bsc')">BSC</button>
                <button class="chain-btn" onclick='setChain("polygon")'>Polygon</button>
                <button class="chain-btn" onclick="setChain('arbitrum')">Arbitrum</button>
                <button class="chain-btn" onclick="setChain('base')">Base</button>
                <button class="chain-btn" onclick="setChain('optimism')">Optimism</button>
                <button class="chain-btn" onclick="setChain('avalanche')">Avalanche</button>
                <button class="chain-btn" onclick="setChain('solana')">Solana</button>
                <button class="chain-btn" onclick="setChain('tron')">TRON</button>
            </div>
            
            <label>Additional Context (optional)</label>
            <textarea id="context" placeholder="Any specific questions about this TX? e.g. 'Is this a rug pull?' or 'What tokens were transferred?'"></textarea>
            
            <button onclick="analyze()" id="analyzeBtn">Analyze Transaction</button>
            
            <div class="loading" id="loading">⏳ Analyzing...</div>
            
            <div class="result" id="result" style="display:none;"></div>
        </div>
        
        <div class="card">
            <label>Quick Analysis Templates</label>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <button class="chain-btn" onclick="setTemplate('rug')">🔍 Rug Pull Check</button>
                <button class="chain-btn" onclick="setTemplate('whale')">🐋 Whale Movement</button>
                <button class="chain-btn" onclick="setTemplate('defi')">🏦 DeFi Interaction</button>
                <button class="chain-btn" onclick="setTemplate('nft')">🖼️ NFT Trade</button>
                <button class="chain-btn" onclick="setTemplate('bridge')">🌉 Bridge Transfer</button>
            </div>
        </div>
        
        <div class="footer">
            Powered by MiniMax AI • Built with ❤️
        </div>
    </div>

    <script>
        let selectedChain = 'ethereum';
        
        function setChain(chain) {
            selectedChain = chain;
            document.querySelectorAll('.chain-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }
        
        function setTemplate(type) {
            const templates = {
                rug: "Analyze if this transaction is related to a rug pull. Check for: liquidity removal, token dumps, suspicious contract interactions, and any red flags.",
                whale: "Analyze this whale movement. What tokens/amounts were transferred? Is this likely an OTC deal, exchange deposit/withdrawal, or portfolio rebalancing?",
                defi: "Analyze this DeFi interaction. What protocol was used? What was the action (swap, lend, borrow, stake)? What were the token amounts and prices?",
                nft: "Analyze this NFT trade. What collection? What was the sale price? Is this a legitimate trade or wash trading?",
                bridge: "Analyze this bridge transfer. What chains are involved? What tokens? Is the bridge protocol safe?"
            };
            document.getElementById('context').value = templates[type] || '';
        }
        
        async function analyze() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const txInput = document.getElementById('txInput').value.trim();
            const context = document.getElementById('context').value.trim();
            
            if (!apiKey) {
                alert('Please enter your MiniMax API key');
                return;
            }
            if (!txInput) {
                alert('Please enter a transaction hash or link');
                return;
            }
            
            const btn = document.getElementById('analyzeBtn');
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            
            btn.disabled = true;
            loading.style.display = 'block';
            result.style.display = 'none';
            
            try {
                // Extract TX hash from URL if needed
                let txHash = txInput;
                if (txInput.includes('/')) {
                    const parts = txInput.split('/');
                    txHash = parts[parts.length - 1];
                }
                
                const prompt = `Analyze this crypto transaction:

Chain: ${selectedChain}
TX Hash: ${txHash}
${context ? '\nSpecific question: ' + context : ''}

Please provide:
1. Transaction type (transfer, swap, contract interaction, etc.)
2. Parties involved (from/to addresses, contracts)
3. Tokens/assets involved and amounts
4. Gas used and cost
5. Any notable observations (suspicious patterns, MEV, failed attempts)
6. Risk assessment if applicable
7. Summary in plain English

Be thorough but concise. Use blockchain explorer data if available.`;

                const response = await fetch('https://api.xiaomimimo.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'mimo-v2.5-pro',
                        messages: [
                            {
                                role: 'system',
                                content: 'You are a crypto transaction analyst. You help users understand blockchain transactions by analyzing transaction hashes, contract interactions, token transfers, and DeFi activities. Provide clear, accurate analysis with risk assessments when relevant.'
                            },
                            {
                                role: 'user',
                                content: prompt
                            }
                        ],
                        temperature: 0.3,
                        max_tokens: 2000
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`API error: ${response.status} ${response.statusText}`);
                }
                
                const data = await response.json();
                const analysis = data.choices[0].message.content;
                
                result.textContent = analysis;
                result.style.display = 'block';
                
            } catch (error) {
                result.textContent = 'Error: ' + error.message;
                result.style.display = 'block';
                result.style.borderColor = 'rgba(255,0,0,0.3)';
                result.style.background = 'rgba(255,0,0,0.05)';
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }
        
        // Enter key to submit
        document.getElementById('txInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') analyze();
        });
    </script>
</body>
</html>
